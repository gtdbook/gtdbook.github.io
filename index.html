<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gtdbook · 项目集</title>
  <meta name="description" content="gtdbook 的自运营体系项目集：GitHub 项目档案，每日自动同步。">
  <meta property="og:title" content="gtdbook · 项目集">
  <meta property="og:description" content="自运营 GitHub 体系 · 每日自动同步">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F7F9'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%230969DA'/%3E%3Crect x='8' y='14.5' width='12' height='3' rx='1.5' fill='%2357606A'/%3E%3Crect x='8' y='20' width='9' height='3' rx='1.5' fill='%239A6700'/%3E%3C/svg%3E">
  <script>/* 首帧前应用主题，避免闪烁；默认浅色 */
    document.documentElement.dataset.theme = (function () {
      try { return localStorage.getItem('theme') || 'light'; } catch (e) { return 'light'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="mono topbar-brand">GTDBOOK <em>/</em> 项目集</span>
      <div class="topbar-right">
        <span class="mono topbar-time">上次同步 <b id="scan-time">—</b> · 每日 08:00 自动更新</span>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="切换到深色主题" title="切换主题">
          <svg class="icon-moon" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M13.6 3.1a7.3 7.3 0 1 0 3.3 9.8A8 8 0 0 1 13.6 3.1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 1.8v2.2M10 16v2.2M18.2 10H16M4 10H1.8M15.7 4.3l-1.6 1.6M5.9 14.1l-1.6 1.6M15.7 15.7l-1.6-1.6M5.9 5.9L4.3 4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 账号介绍 -->
    <section class="hero">
      <img id="owner-avatar" class="hero-avatar" src="" alt="" width="84" height="84">
      <div class="hero-text">
        <p class="eyebrow mono">SELF-OPERATED PROJECTS</p>
        <h1 id="owner-name">—</h1>
        <a class="owner-link mono" id="owner-link" href="#" target="_blank" rel="noopener">@gtdbook ↗</a>
        <p class="owner-bio" id="owner-bio">一套自动运转的 GitHub 体系：抓取、处理、部署、自愈，不需要人盯着。</p>
        <dl class="stats">
          <div class="stat"><dt>项目</dt><dd id="stat-repos">—</dd></div>
          <div class="stat"><dt>Stars</dt><dd id="stat-stars" class="amber">—</dd></div>
          <div class="stat"><dt>Forks</dt><dd id="stat-forks">—</dd></div>
          <div class="stat"><dt>语言</dt><dd id="stat-langs">—</dd></div>
        </dl>
      </div>
    </section>

    <!-- 控制台：搜索 / 语言筛选 / 排序 -->
    <section class="console">
      <div class="search-box">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13.8" y1="13.8" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="search" placeholder="搜索项目名、描述或主题…" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="group" aria-label="按语言筛选"></div>
      <label class="sort-box mono">
        排序
        <select id="sort">
          <option value="pushed">最近更新</option>
          <option value="stars">最多 STAR</option>
          <option value="created">最新创建</option>
        </select>
      </label>
    </section>

    <p class="count-line mono" id="count-line">—</p>

    <!-- 项目卡片 -->
    <section class="cards" id="cards"></section>

    <div class="state-panel" id="empty-state" hidden>
      <p>没有匹配的项目</p>
      <p class="sub">试试清除搜索词或语言筛选。</p>
      <button class="reset-btn" id="reset-btn" type="button">清除全部筛选</button>
    </div>
    <div class="state-panel" id="error-state" hidden>
      <p>数据加载失败</p>
      <p class="sub">可能是网络波动，请稍后重试。</p>
      <button class="reset-btn" id="retry-btn" type="button">重新加载</button>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <p class="mono">项目数据来自 GITHUB · 由 <a href="https://github.com/gtdbook/gtdbook.github.io/actions" target="_blank" rel="noopener">GITHUB ACTIONS</a> 每日 08:00（北京时间）自动同步</p>
      <p class="mono dim">LAST SYNC <span id="footer-time">—</span> · <a href="https://gtdbook.github.io/self-ops/" target="_blank" rel="noopener">情报站 ↗</a> · <a href="https://github.com/gtdbook/gtdbook.github.io" target="_blank" rel="noopener">本站源码 ↗</a></p>
    </div>
  </footer>

  <noscript><p style="text-align:center;padding:40px">需要启用 JavaScript 才能查看项目数据。</p></noscript>
  <script src="app.js"></script>
</body>
</html>
